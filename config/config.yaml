###########
# Preface #
###########


# This file contains an example for the general configuration of the Snakemake
# workflow to map bulk RNA-seq reads to the genome using STAR.
# It will be validated by Snakemake against the schema provided in
# `workflow/schemas/config.schema.yaml`.


##################
# Example config #
##################

# The following parameters are required.
# Please make sure to adjust them to your project before running the workflow.

reads_dir: resources/reads

fastq_extension: fastq.gz

genome:
  name: GRCh38
  fasta_url: https://ftp.ensembl.org/pub/release-116/fasta/homo_sapiens/dna/Homo_sapiens.GRCh38.dna.primary_assembly.fa.gz

transcriptome:
  name: GRCh38.ensembl_v116
  gtf_url: https://ftp.ensembl.org/pub/release-116/gtf/homo_sapiens/Homo_sapiens.GRCh38.116.gtf.gz

samples:
  dir1:
    sample_id1: sample1
    sample_id2: sample2
  dir2:
    sample_id3: sample3


#######################
# Optional parameters #
#######################

# The following config options are supported but don't have to be set for the
# configuration to be valid.

# The values listed here are the corresponding default values.

